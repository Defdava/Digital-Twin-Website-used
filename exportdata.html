    <script>
        class User {
            constructor(username, email, password, idWorker, profilePic = '/assets/user.JPG') {

        class AuthSystem {
            constructor() {
                this.users = JSON.parse(localStorage.getItem('users')) || [];
            }

            register(username, email, password, idWorker, profilePic) {
                const userExists = this.users.some(user => user.email === email);
                if (userExists) {
                    throw new Error('User already exists!');
                }
                const user = new User(username, email, password, idWorker, profilePic);
                this.users.push(user);
                localStorage.setItem('users', JSON.stringify(this.users));
                return user;
            }

            login(email, password) {
                const user = this.users.find(u => u.email === email && u.password === password);
                if (user) {
                    return user;
                }
                throw new Error('Invalid email or password!');
            }
        }

        const auth = new AuthSystem();
        const firebaseConfig = {

        firebase.initializeApp(firebaseConfig);
        const slotHistoryRef = firebase.database().ref("slot_history");

        // Tour Steps Configuration
        const tourSteps = [
            {
                element: 'header',

                text: "Click the BRIN logo to open the sidebar toolbar, which contains features like Profile, Log Out, Live Overview, Previous Analysis, Export Data, Helpdesk, and Parking Analysis.",

            },
            {
                element: '#exportBtn',
                title: "Export Data Button",
                text: "Click this button to export the filtered slot history data to an Excel file (.xlsx).",
                position: 'top'
            }
        ];

        let currentTourStep = 0;

        function startTour() {
            document.getElementById('tourOverlay').style.display = 'block';
            showTooltip(currentTourStep);
        }

        function showTooltip(step) {
            const tooltip = document.getElementById('tourTooltip');
            const title = document.getElementById('tooltipTitle');
            const text = document.getElementById('tooltipText');
            const nextBtn = document.getElementById('tourNextBtn');

            const targetElement = document.querySelector(tourSteps[step].element);
            if (!targetElement) {
                console.error(`Element ${tourSteps[step].element} not found!`);
                endTour();
                return;
            }

            title.textContent = tourSteps[step].title;
            text.textContent = tourSteps[step].text;
            tooltip.style.display = 'block';
            tooltip.className = 'tour-tooltip ' + tourSteps[step].position;

            const rect = targetElement.getBoundingClientRect();
            const tooltipRect = tooltip.getBoundingClientRect();
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const margin = 20;
            let left, top;

            if (tourSteps[step].position === 'center') {
                // Position tooltip at screen center
                left = (viewportWidth - tooltipRect.width) / 2;
                top = (viewportHeight - tooltipRect.height) / 2;
                // Ensure tooltip stays within screen bounds with margin
                left = Math.max(margin, Math.min(left, viewportWidth - tooltipRect.width - margin));
                top = Math.max(margin, Math.min(top, viewportHeight - tooltipRect.height - margin));
            } else {
                switch (tourSteps[step].position) {
                    case 'right':
                        left = rect.right + 10;
                        top = rect.top + (rect.height / 2) - (tooltipRect.height / 2);
                        left = Math.max(margin, Math.min(left, viewportWidth - tooltipRect.width - margin));
                        top = Math.max(margin, Math.min(top, viewportHeight - tooltipRect.height - margin));
                        break;
                    case 'left':
                        left = rect.left - tooltipRect.width - 10;
                        top = rect.top + (rect.height / 2) - (tooltipRect.height / 2);
                        left = Math.max(margin, Math.min(left, viewportWidth - tooltipRect.width - margin));
                        top = Math.max(margin, Math.min(top, viewportHeight - tooltipRect.height - margin));
                        break;
                    case 'top':
                        left = rect.left + (rect.width / 2) - (tooltipRect.width / 2);
                        top = rect.top - tooltipRect.height - 10;
                        left = Math.max(margin, Math.min(left, viewportWidth - tooltipRect.width - margin));
                        top = Math.max(margin, Math.min(top, viewportHeight - tooltipRect.height - margin));
                        break;
                    case 'bottom':
                        left = rect.left + (rect.width / 2) - (tooltipRect.width / 2);
                        top = rect.bottom + 10;
                        left = Math.max(margin, Math.min(left, viewportWidth - tooltipRect.width - margin));
                        top = Math.max(margin, Math.min(top, viewportHeight - tooltipRect.height - margin));
                        break;
                }
            }

            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;

            nextBtn.textContent = step === tourSteps.length - 1 ? 'Finish' : 'Next';
        }

        function endTour() {
            document.getElementById('tourOverlay').style.display = 'none';
            document.getElementById('tourTooltip').style.display = 'none';
            currentTourStep = 0;
        }

        function showError(message) {
            const errorElement = document.getElementById('error-message');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            setTimeout(() => { errorElement.style.display = 'none'; }, 5000);
        }

        function showSuccess(message) {
            const successElement = document.getElementById('success-message');
            successElement.textContent = message;
            successElement.style.display = 'block';
            setTimeout(() => { successElement.style.display = 'none'; }, 5000);
        }

        let historyDataArray = [];

        function renderHistoryTable() {
            const slotHistoryTable = document.getElementById("slotHistoryTable").getElementsByTagName('tbody')[0];
            slotHistoryTable.innerHTML = "";

            const filterSlot = document.getElementById('filterSlot').value.trim();
            const filterDate = document.getElementById('filterDate').value;
            const filterStatus = document.getElementById('filterStatus').value;

            historyDataArray.forEach((entry) => {
                const entryDate = entry.timestamp.split(' ')[0];
                if (filterSlot && entry.slot !== filterSlot) return;
                if (filterDate && entryDate !== filterDate) return;
                if (filterStatus && entry.status !== filterStatus) return;

                const row = slotHistoryTable.insertRow();
                row.insertCell(0).textContent = entry.slot;
                row.insertCell(1).textContent = entry.timestamp;
                row.insertCell(2).textContent = entry.status;
                row.insertCell(3).textContent = entry.size;

                if (entry.status === 'terisi') {
                    row.cells[2].className = 'status in';
                } else if (entry.status === 'kosong') {
                    row.cells[2].className = 'status out';
                }
            });

            if (slotHistoryTable.rows.length === 0) {
                showError("No data matches the current filters.");
            }
        }

        function exportToExcel() {
            const filteredData = [];
            const filterSlot = document.getElementById('filterSlot').value.trim();
            const filterDate = document.getElementById('filterDate').value;
            const filterStatus = document.getElementById('filterStatus').value;

            historyDataArray.forEach((entry) => {
                const entryDate = entry.timestamp.split(' ')[0];
                if (filterSlot && entry.slot !== filterSlot) return;
                if (filterDate && entryDate !== filterDate) return;
                if (filterStatus && entry.status !== filterStatus) return;

                filteredData.push({
                    Slot: entry.slot,
                    Timestamp: entry.timestamp,
                    Status: entry.status,
                    Size: entry.size
                });
            });

            if (filteredData.length === 0) {
                showError("No data to export.");
                return;
            }

            const worksheet = XLSX.utils.json_to_sheet(filteredData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Slot History");
            XLSX.writeFile(workbook, `BRIN_Slot_History_${new Date().toISOString().split('T')[0]}.xlsx`);
            showSuccess("Data successfully exported.");
        }

        document.addEventListener("DOMContentLoaded", () => {

            const toolbar = document.getElementById('toolbar');
            toggleToolbar.addEventListener('click', () => {

                document.getElementById('mainContent').classList.toggle('with-toolbar');

            slotHistoryRef.on("value", (snapshot) => {
                console.log("Firebase slot_history data:", snapshot.val());
                const historyData = snapshot.val();
                historyDataArray = [];

                if (!historyData) {
                    console.warn("No slot history data available.");
                    renderHistoryTable();
                    showError("No slot history data available.");
                    return;
                }

                Object.keys(historyData).forEach((slotKey) => {
                    const slotLogs = historyData[slotKey];
                    Object.entries(slotLogs).forEach(([timestamp, entry]) => {
                        const status = entry.status === true || entry.status === 'terisi' ? 'terisi' : 'kosong';
                        const slotNumber = slotKey.split("_")[1];
                        const size = entry.size ? entry.size.toLowerCase() : 'none';
                        historyDataArray.push({
                            slot: slotNumber,
                            timestamp: timestamp,
                            status: status,
                            size: size
                        });
                    });
                });

                historyDataArray.sort((a, b) => b.timestamp.localeCompare(a.timestamp));
                renderHistoryTable();
            }, (error) => {
                console.error("Error fetching slot history:", error);
                showError("Failed to fetch slot history data.");
            });

            document.getElementById('filterSlot').addEventListener('input', renderHistoryTable);
            document.getElementById('filterDate').addEventListener('change', renderHistoryTable);
            document.getElementById('filterStatus').addEventListener('change', renderHistoryTable);

            document.getElementById('tourNextBtn').addEventListener('click', () => {
                currentTourStep++;
                if (currentTourStep < tourSteps.length) {
                    showTooltip(currentTourStep);
                } else {
                    endTour();
                }
            });

            document.getElementById('tourCloseBtn').addEventListener('click', endTour);

            document.getElementById('exportBtn').addEventListener('click', exportToExcel);

            document.addEventListener('keydown', (event) => {
                if ((event.ctrlKey || event.metaKey) && (event.key === 'z' || event.key === 'y' || event.key === 'Z' || event.key === 'Y')) {
                    event.preventDefault();
                    console.log('Undo/Redo is disabled');
                }
            });

            window.addEventListener('popstate', (event) => {
                event.preventDefault();
                if (!localStorage.getItem('currentUser')) {
                    window.location.replace('/login.html');
                } else {
                    history.replaceState(null, null, window.location.href);
                }
            });

            // Start the tour
            startTour();
        });
    </script>
</body>
</html>
